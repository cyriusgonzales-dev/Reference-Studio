# Packaging for Windows and macOS. See docs/RELEASING.md.
#
# Builds are unsigned unless signing credentials are provided through
# electron-builder's standard environment variables (never commit them):
#   Windows: CSC_LINK, CSC_KEY_PASSWORD
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application certificate)
#            and APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER for notarization
appId: app.vmix-reference-studio
productName: Vmix Reference Studio
copyright: Copyright © 2026 Cyrius Gonzales
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
# koffi (used to call the NDI library) ships a native binary that must live outside the asar archive.
asarUnpack:
  - node_modules/koffi/**

# Where the in-app updater looks for new versions. Keep in sync with GITHUB_REPO in src/shared/product.ts.
# This is a separate PUBLIC repository that holds only releases, so the source code can stay
# private while anyone can download installers and updates. CI writes to it with RELEASES_TOKEN.
publish:
  provider: github
  owner: cyriusgonzales-dev
  repo: Reference-Studio-releases
  releaseType: draft

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vmix Reference Studio
  # Settings and caches are kept, so reinstalling or updating never loses them.
  deleteAppDataOnUninstall: false
  artifactName: Vmix-Reference-Studio-Setup-${version}.${ext}
portable:
  artifactName: Vmix-Reference-Studio-${version}-portable.${ext}

mac:
  icon: build/icon-mac.png
  category: public.app-category.video
  minimumSystemVersion: "11.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # dmg is what people download; zip is what the in-app updater downloads.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Vmix-Reference-Studio-${version}-mac-${arch}.${ext}
dmg:
  title: Vmix Reference Studio ${version}
  artifactName: Vmix-Reference-Studio-${version}-mac-${arch}.${ext}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

# Electron fuses harden the shipped binary:
#  - it cannot be started as a plain Node.js runtime (ELECTRON_RUN_AS_NODE)
#  - NODE_OPTIONS and --inspect are ignored
#  - only the integrity-checked app.asar is loaded
# grantFileProtocolExtraPrivileges stays enabled because the app's own pages load from file://.
# resetAdHocDarwinSignature keeps unsigned Apple-silicon builds launchable after the fuses change the binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
  resetAdHocDarwinSignature: true
