# Builds the Windows and macOS installers and publishes them as a GitHub Release in the
# repository named by publish.owner/publish.repo in electron-builder.yml (this one). That
# repository must be PUBLIC so the website and the in-app updater can download from it.
#
# How to release (see docs/RELEASING.md):
#   npm version 1.2.3        # bumps package.json and creates the tag v1.2.3
#   git push --follow-tags   # starts this workflow
# The release is created as a draft, both platforms upload to it, and it is published
# automatically once every installer is there. The in-app updater and the website only
# see published releases, so nobody ever gets a half-uploaded release.
#
# Optional repository secret:
#   RELEASES_TOKEN   only if releases go to a different repository: a fine-grained token with
#                    "Contents: Read and write" on it (GITHUB_TOKEN can only write to this repo)
#
# Optional repository secrets for code signing (builds are unsigned without them):
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                   Windows code-signing certificate (.pfx, base64)
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD                   Apple "Developer ID Application" certificate (.p12, base64)
#   APPLE_API_KEY_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key for notarization
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the draft release (notes from CHANGELOG.md) before the builds start, so the
  # Windows and macOS jobs upload to the same release instead of racing to create one.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      repo: ${{ steps.target.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-release-config.mjs
      - id: target
        run: |
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          owner=$(awk '/^publish:/{p=1} p && /^ *owner:/{print $2; exit}' electron-builder.yml)
          repo=$(awk '/^publish:/{p=1} p && /^ *repo:/{print $2; exit}' electron-builder.yml)
          echo "repo=$owner/$repo" >> "$GITHUB_OUTPUT"
      - name: Check the releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          visibility=$(gh repo view "$REPO" --json visibility --jq .visibility) || {
            echo "::error::Cannot reach $REPO. If releases go to another repository, add a RELEASES_TOKEN secret that can write to it."; exit 1; }
          if [ "$visibility" != "PUBLIC" ]; then
            echo "::error::$REPO is $visibility. It must be public, or visitors and the updater cannot download the installers."; exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists in $REPO."
            exit 0
          fi
          VERSION="${TAG#v}"
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Vmix Reference Studio $VERSION" > notes.md
          TARGET=""
          [ "$REPO" = "$GITHUB_REPOSITORY" ] && TARGET="--target $GITHUB_SHA"
          gh release create "$TAG" --repo "$REPO" --draft $TARGET \
            --title "Vmix Reference Studio $VERSION" --notes-file notes.md

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # At job level so a step's `if:` can test whether it is set.
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run check
      - run: npm run build

      - name: Prepare the notarization key (macOS)
        if: matrix.platform == 'mac' && env.APPLE_API_KEY_BASE64 != ''
        shell: bash
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Package and upload (Windows)
        if: matrix.platform == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          npx electron-builder --win --x64 --publish always

      - name: Package and upload (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ADHOC=""
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # No Developer ID certificate: sign ad hoc, so macOS offers "Open Anyway" instead of
            # reporting the app as damaged on Apple silicon.
            ADHOC="-c.mac.identity=-"
          fi
          [ -z "$APPLE_API_KEY_ID" ] && unset APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY
          npx electron-builder --mac --publish always $ADHOC
          # Fail here, not on a user's Mac, if the app's signature is broken.
          for app in release/mac*/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

  # Publishes the release once both platforms have uploaded their installers.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ needs.prepare.outputs.repo }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
